<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>arXiv Daily · AI 论文速读</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <div class="head-row">
    <h1>arXiv Daily</h1>
    <div class="meta">
      <select id="date-select"></select>
      <input id="search" type="search" placeholder="搜索标题/作者/摘要…" />
    </div>
  </div>
  <nav id="topic-tabs"></nav>
</header>

<main>
  <div id="status"></div>
  <div id="paper-list"></div>
</main>

<footer>
  <span id="footer-text">数据来源 arXiv · 每日自动更新</span>
</footer>

<script src="app.js"></script>
</body>
</html>
